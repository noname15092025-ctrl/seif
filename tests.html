<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SHUT — автотесты</title>
<style>
  body{ margin:0; padding:24px; background:#0E0E10; color:#ECECEE; font:14px/1.5 system-ui, sans-serif; }
  h1{ font-size:22px; margin:0 0 4px; } p.sub{ color:#8A8A90; margin:0 0 18px; }
  .sum{ padding:12px 16px; border-radius:12px; margin:0 0 16px; font-weight:700; }
  .sum.ok{ background:#1E2410; color:#C8E27A; } .sum.bad{ background:#2A1214; color:#FF8A8F; }
  .t{ padding:6px 10px; border-radius:8px; margin:2px 0; font-family:ui-monospace, Menlo, monospace; font-size:12.5px; white-space:pre-wrap; }
  .t.ok{ color:#9FBF5A; } .t.bad{ background:#2A1214; color:#FF8A8F; }
  h2{ font-size:15px; margin:18px 0 6px; color:#C9C9CF; }
</style>
</head>
<body>
<h1>SHUT — автотесты</h1>
<p class="sub">Проверяют логику без входа в сейф: штрихкоды (с распознаванием через ZXing), повторы событий, правки «только это / последующие / все», импорт и экспорт .ics. Откройте эту страницу после правок — всё должно быть зелёным.</p>
<div id="sum" class="sum">Выполняю…</div>
<div id="out"></div>
<input id="search" type="hidden" value="">
<script>
// Минимальное окружение вместо app.js
var lang = "ru";
const T = (ru) => ru;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let entries = [];
const live = () => entries.filter(x => !x.deletedAt);
const tasksList = () => live().filter(x => x.type === "task");
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const b64 = u8 => btoa(String.fromCharCode(...u8));
const safeUrl = u => { u = (u || "").trim(); if (!u) return ""; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u; try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
let vaultKey = null;
</script>
<script src="md.js"></script>
<script src="merge.js"></script>
<script src="qr.js"></script>
<script src="loyalty.js"></script>
<script src="calendar.js"></script>
<script src="vendor/zxing.min.js"></script>
<script>
(async () => {
  const out = $("out"); let pass = 0, fail = 0;
  const section = name => out.insertAdjacentHTML("beforeend", "<h2>" + esc(name) + "</h2>");
  const ok = (name, cond, extra) => { cond ? pass++ : fail++; out.insertAdjacentHTML("beforeend", `<div class="t ${cond ? "ok" : "bad"}">${cond ? "✓" : "✗"} ${esc(name)}${!cond && extra !== undefined ? "\n   получено: " + esc(JSON.stringify(extra)) : ""}</div>`); };
  const eq = (name, got, want) => ok(name, JSON.stringify(got) === JSON.stringify(want), got);

  /* ---------- Штрихкоды ---------- */
  section("Штрихкоды скидочных карт");
  eq("EAN-13: верная контрольная цифра", eanValid("4810000123458"), true);
  eq("EAN-13: неверная контрольная цифра", eanValid("4810000123457"), false);
  eq("Формат: 13 цифр с верной суммой → EAN-13", barcodeFormat("4810000123458"), "ean13");
  eq("Формат: 8 цифр с верной суммой → EAN-8", barcodeFormat("96385074"), "ean8");
  eq("Формат: произвольный номер → Code 128", barcodeFormat("FP-12345"), "code128");
  eq("Формат: сканер сказал QR → QR", barcodeFormat("123", "qr_code"), "qr");
  const reader = new ZXing.MultiFormatReader();
  const decode = async (num) => {
    let svg = barcodeSvg(num).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" ');
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    const img = new Image(); img.src = url; await img.decode();
    const cv = document.createElement("canvas"); cv.width = 1000; cv.height = 260; const c = cv.getContext("2d");
    c.fillStyle = "#fff"; c.fillRect(0, 0, 1000, 260); c.drawImage(img, 50, 30, 900, 200); URL.revokeObjectURL(url);
    try { return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText(); } catch { return null; }
  };
  for (const n of ["4810000123458", "4601234567893", "96385074", "123456789012", "1234567", "FP-12345", "ABCxyz-0099"])
    eq("Нарисованный штрихкод распознаётся: " + n, await decode(n), n);

  /* ---------- Повторы ---------- */
  section("Повторы событий");
  const occDays = (e, from, to) => evOccurrences(e, new Date(from), new Date(to)).map(o => cYmd(o.s));
  const base = { type: "event", allDay: false, start: "2026-11-16T10:00", end: "2026-11-16T11:00" };
  eq("Каждый день, неделя", occDays({ ...base, repeat: "daily" }, "2026-11-16", "2026-11-23").length, 7);
  eq("По будням: без субботы и воскресенья", occDays({ ...base, repeat: "weekdays" }, "2026-11-16", "2026-11-23"), ["2026-11-16", "2026-11-17", "2026-11-18", "2026-11-19", "2026-11-20"]);
  eq("Каждую неделю", occDays({ ...base, repeat: "weekly" }, "2026-11-01", "2026-12-15"), ["2026-11-16", "2026-11-23", "2026-11-30", "2026-12-07", "2026-12-14"]);
  eq("Каждый месяц 31-го: месяцы без 31-го пропускаются", occDays({ ...base, start: "2026-01-31T10:00", end: "2026-01-31T11:00", repeat: "monthly" }, "2026-01-01", "2026-06-01"), ["2026-01-31", "2026-03-31", "2026-05-31"]);
  eq("Каждый год 29 февраля: только високосные", occDays({ ...base, start: "2024-02-29T10:00", end: "2024-02-29T11:00", repeat: "yearly" }, "2024-01-01", "2033-01-01"), ["2024-02-29", "2028-02-29", "2032-02-29"]);
  eq("Повторять до (включительно)", occDays({ ...base, repeat: "daily", until: "2026-11-18" }, "2026-11-16", "2026-11-30"), ["2026-11-16", "2026-11-17", "2026-11-18"]);
  eq("Исключённые дни не показываются", occDays({ ...base, repeat: "daily", ex: ["2026-11-17"] }, "2026-11-16", "2026-11-19"), ["2026-11-16", "2026-11-18"]);
  eq("Весь день, несколько дней: попадает в каждый день", evOccurrences({ type: "event", allDay: true, start: "2026-12-01", end: "2026-12-03", repeat: "none" }, new Date("2026-12-02T00:00"), new Date("2026-12-03T00:00")).length, 1);
  eq("Каждые 2 недели", occDays({ ...base, repeat: "weekly", every: 2 }, "2026-11-01", "2026-12-31"), ["2026-11-16", "2026-11-30", "2026-12-14", "2026-12-28"]);
  eq("Каждые 3 дня", occDays({ ...base, repeat: "daily", every: 3 }, "2026-11-16", "2026-11-26"), ["2026-11-16", "2026-11-19", "2026-11-22", "2026-11-25"]);
  eq("Каждые 2 месяца", occDays({ ...base, repeat: "monthly", every: 2 }, "2026-11-01", "2027-06-01"), ["2026-11-16", "2027-01-16", "2027-03-16", "2027-05-16"]);
  eq("Каждые 2 недели, далёкое будущее — без сдвига фазы", occDays({ ...base, repeat: "weekly", every: 2 }, "2030-01-01", "2030-01-29").length, 2);
  section("Напоминания");
  eq("Старое событие с одним напоминанием", evReminds({ remind: 10 }), [10]);
  eq("Несколько напоминаний, без повторов, не больше 5", evReminds({ reminds: [10, 60, 10, 1440, 0, 5, 30] }), [10, 60, 1440, 0, 5]);
  eq("Без напоминаний", evReminds({ remind: -1 }), []);
  eq("Весь день: «за 1 день» — в 9:00 накануне", cYmd(evRemindAt({ e: { allDay: true }, s: new Date(2026, 11, 2) }, 1440)) + " " + cHm(evRemindAt({ e: { allDay: true }, s: new Date(2026, 11, 2) }, 1440)), "2026-12-01 09:00");
  eq("Далёкое будущее считается быстро (без перебора с начала)", occDays({ ...base, repeat: "daily" }, "2036-01-01", "2036-01-03"), ["2036-01-01", "2036-01-02"]);

  /* ---------- Только это / последующие / все ---------- */
  section("Изменение повторяющегося события");
  const mk = () => { entries = []; const e = calMakeEvent({ ...base, title: "Стендап", repeat: "daily", until: "", ex: [] }); entries.push(e); return e; };
  const view = () => occInRangeAll(new Date("2026-11-16T00:00"), new Date("2026-11-23T00:00")).map(o => cYmd(o.s) + " " + cHm(o.s)).sort();
  let s = mk();
  calApplyEdit(s, { ...base, title: "Стендап", start: "2026-11-18T15:00", end: "2026-11-18T16:00", repeat: "daily", until: "" }, new Date("2026-11-18T10:00"), new Date("2026-11-16T10:00"), "one");
  eq("«Только это»: 18-е перенесено на 15:00, остальные на месте", view(), ["2026-11-16 10:00", "2026-11-17 10:00", "2026-11-18 15:00", "2026-11-19 10:00", "2026-11-20 10:00", "2026-11-21 10:00", "2026-11-22 10:00"]);
  s = mk();
  calApplyEdit(s, { ...base, title: "Стендап", start: "2026-11-20T12:00", end: "2026-11-20T13:00", repeat: "daily", until: "" }, new Date("2026-11-20T10:00"), new Date("2026-11-16T10:00"), "next");
  eq("«Это и последующие»: с 20-го — 12:00", view(), ["2026-11-16 10:00", "2026-11-17 10:00", "2026-11-18 10:00", "2026-11-19 10:00", "2026-11-20 12:00", "2026-11-21 12:00", "2026-11-22 12:00"]);
  s = mk();
  calApplyEdit(s, { ...base, title: "Стендап", start: "2026-11-19T09:00", end: "2026-11-19T10:00", repeat: "daily", until: "" }, new Date("2026-11-19T10:00"), new Date("2026-11-16T10:00"), "all");
  eq("«Все события»: вся серия сдвинута на 9:00", view()[0] + " … " + view()[6], "2026-11-16 09:00 … 2026-11-22 09:00");
  s = mk(); calApplyDelete(s, new Date("2026-11-17T10:00"), new Date("2026-11-16T10:00"), "one");
  eq("Удалить только 17-е", view().length, 6);
  s = mk(); calApplyDelete(s, new Date("2026-11-19T10:00"), new Date("2026-11-16T10:00"), "next");
  eq("Удалить 19-е и последующие", view(), ["2026-11-16 10:00", "2026-11-17 10:00", "2026-11-18 10:00"]);

  /* ---------- .ics ---------- */
  section("Импорт и экспорт .ics");
  eq("UNTIL берётся датой без сдвига пояса", icsRepeat("FREQ=DAILY;UNTIL=20261231T235959Z").until, "2026-12-31");
  eq("По будням из Google (BYDAY=MO..FR)", icsRepeat("FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR").repeat, "weekdays");
  eq("«Каждые 2 недели» из .ics (INTERVAL=2)", icsRepeat("FREQ=WEEKLY;INTERVAL=2"), { repeat: "weekly", every: 2, until: "", count: 0 });
  eq("«Каждый 2-й вторник месяца» пока помечается как неподдерживаемый", !!icsRepeat("FREQ=MONTHLY;BYDAY=2TU").unsupported, true);
  const ics = ["BEGIN:VCALENDAR", "BEGIN:VEVENT", "UID:a@x", "DTSTART;VALUE=DATE:20261201", "DTEND;VALUE=DATE:20261203", "SUMMARY:Отпуск\\, море", "DESCRIPTION:Строка 1\\nhttps://meet.google.com/abc-defg-hij", "LOCATION:Минск",
    "ATTENDEE;CN=A:mailto:a@example.com", "BEGIN:VALARM", "TRIGGER:-PT30M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const p = icsParse(ics)[0];
  eq("Разбор: название с экранированием", p.title, "Отпуск, море");
  eq("Разбор: весь день", p.start.allDay, true);
  eq("Разбор: гость", p.attendees, ["a@example.com"]);
  eq("Разбор: напоминание за 30 минут", p.remind, 30);
  ok("Разбор: длинные строки склеиваются", icsParse("BEGIN:VEVENT\r\nSUMMARY:Очень длинн\r\n ое название\r\nDTSTART:20261201T100000\r\nEND:VEVENT")[0].title === "Очень длинное название");
  // экспорт → разбор → те же данные
  entries = [calMakeEvent({ ...base, title: "Встреча; важно", repeat: "weekdays", until: "2026-12-31", ex: ["2026-11-18"], meet: "https://meet.jit.si/SHUT-x", location: "Офис, 5", guests: "a@b.c", note: "Повестка\nпункт 2", remind: 10, color: 1 })];
  let blob = null; window.download = b => { blob = b; }; window.toast = () => {};
  calExportIcs();
  const back = icsParse(await blob.text())[0];
  eq("Экспорт → импорт: название", back.title, "Встреча; важно");
  eq("Экспорт → импорт: повтор по будням до 31.12", icsRepeat(back.rrule), { repeat: "weekdays", until: "2026-12-31", count: 0 });
  eq("Экспорт → импорт: исключение 18-го", back.exdates, ["2026-11-18"]);
  eq("Экспорт → импорт: место", back.location, "Офис, 5");
  eq("Экспорт → импорт: ссылка на встречу", back.url, "https://meet.jit.si/SHUT-x");
  eq("Экспорт → импорт: напоминание", back.remind, 10);
  ok("Экспорт: строки не длиннее 75 символов", (await blob.text()).split("\r\n").every(l => l.length <= 75));

  /* ---------- Markdown заметок ---------- */
  section("Заметки: Markdown");
  const H = (s, o) => mdToHtml(s, o);
  ok("Выделение ==текст==", H("a ==b== c").includes("<mark>b</mark>"));
  ok("Спойлер ||текст||", H("||тайна||").includes('class="md-spoiler"'));
  ok("Ссылка [[Заметка]]", H("см. [[План]]").includes('data-wiki="План"'));
  ok("Ссылка на несуществующую заметку помечается", H("[[Нет такой]]", { noteExists: () => false }).includes("md-wiki missing"));
  ok("Подпись ссылки [[Заметка|текст]]", />текст<\/a>/.test(H("[[План|текст]]")));
  ok("Сноски: номер и список внизу", (() => { const h = H("Факт[^a] и ещё[^b].\n\n[^a]: Источник 1\n[^b]: Источник 2"); return h.includes('data-fn="1"') && h.includes('data-fn="2"') && h.includes("md-fns") && h.includes("Источник 2"); })());
  ok("HTML в тексте экранируется", !H("<script>alert(1)<\/script> <img src=x onerror=1>").includes("<script") && !H("<img src=x>").includes("<img"));
  ok("Опасная ссылка javascript: не превращается в ссылку", !H("[x](javascript:alert(1))").includes("href=\"javascript"));
  ok("Теги #работа", H("задача #работа").includes('data-tag="работа"'));
  eq("Теги собираются (без заголовков и кода)", mdTags("# Заголовок\nтекст #Дом и #работа\n```\n#нет\n```"), ["дом", "работа"]);
  eq("Ссылки собираются", mdLinks("[[A]] и [[b|подпись]] и [[A]]"), ["a", "b"]);
  ok("Callout > [!ВАЖНО]", H("> [!ВАЖНО] Проверить\n> текст").includes("md-co-warn"));
  ok("Вложенный список", (() => { const h = H("- a\n  - b\n    - c\n- d"); return (h.match(/<ul>/g) || []).length === 3; })());
  section("Заметки: таблицы и формулы");
  const tbl = "| Товар | Цена | Кол-во | Сумма |\n|---|---:|---:|---:|\n| Хлеб | 2,5 | 2 | =B1*C1 |\n| Молоко | 3 | 1 | =B2*C2 |\n| Итого | | | =SUM(ABOVE) |";
  const th = H(tbl);
  ok("Таблица рисуется", th.includes("<table") && (th.match(/<tr>/g) || []).length === 4);
  const calc = [...th.matchAll(/class="md-calc"[^>]*>([^<]+)</g)].map(m => m[1]);
  eq("Формулы: =B1*C1, =B2*C2, =SUM(ABOVE)", calc, ["5", "3", "8"]);
  eq("Формула: SUM диапазона", mdFormula("SUM(A1:A3)", [["1"], ["2"], ["3"], [""]], 3, 0, 0), 6);
  eq("Формула: AVG и ROUND", mdFormula("ROUND(AVG(A1:A3), 1)", [["1"], ["2"], ["2"], [""]], 3, 0, 0), 1.7);
  eq("Формула: скобки и приоритет", mdFormula("(2+3)*4-6/2", [[""]], 0, 0, 0), 17);
  ok("Циклическая формула → ошибка, а не зависание", H("| a |\n|---|\n| =A1 |").includes("md-calc err"));
  section("Заметки: задачи");
  const body = "План:\n- [ ] Купить\n  - [x] Хлеб\n  - [ ] Молоко\n```\n- [ ] не задача\n```\n> - [ ] и не эта\n- [ ] Позвонить";
  eq("Задачи из текста (без кода и цитат)", mdTasks(body).map(t => [t.index, t.level, t.done, t.text]), [[0, 0, false, "Купить"], [1, 1, true, "Хлеб"], [2, 1, false, "Молоко"], [3, 0, false, "Позвонить"]]);
  ok("Номера чекбоксов в просмотре совпадают с задачами", (() => { const h = H(body); return [...h.matchAll(/data-cb="(\d+)"/g)].map(m => +m[1]).join() === "0,1,2,3"; })());
  ok("Отметка 3-й задачи меняет именно «Молоко»", mdToggleTask(body, 2).includes("  - [x] Молоко") && mdToggleTask(body, 2).includes("- [ ] не задача"));
  section("Быстрое добавление: разбор фразы");
  const now = new Date(2026, 10, 21, 22, 0); // сб 21.11.2026 22:00
  const P = s => { const p = qaParse(s, now); return [p.kind, p.title, p.date ? cYmd(p.date) : null, p.time ? p.time.join(":") : null, p.dur, p.remind, p.repeat]; };
  eq("Событие: день недели, время, длительность, напоминание", P("Стоматолог пт 15:00 на час напомнить за 30 мин"), ["event", "Стоматолог", "2026-11-27", "15:0", 60, 30, "none"]);
  eq("Задача со сроком «завтра»", P("задача купить молоко завтра"), ["task", "купить молоко", "2026-11-22", null, null, null, "none"]);
  eq("Без даты и времени — задача", P("позвонить маме"), ["task", "позвонить маме", null, null, null, null, "none"]);
  eq("Заметка", P("заметка Идеи для отпуска"), ["note", "Идеи для отпуска", null, null, null, null, "none"]);
  eq("Повтор по будням", P("Планёрка по будням 10:00"), ["event", "Планёрка", "2026-11-21", "10:0", null, null, "weekdays"]);
  eq("Дата 25.11 — дата, а не время", P("Отчёт 25.11"), ["task", "Отчёт", "2026-11-25", null, null, null, "none"]);
  eq("«25 декабря в 19» и 2 часа", P("Ужин 25 декабря в 19 на 2 часа"), ["event", "Ужин", "2026-12-25", "19:0", 120, null, "none"]);
  eq("Время уже прошло сегодня — переносится на завтра", P("Созвон 21:00"), ["event", "Созвон", "2026-11-22", "21:0", null, null, "none"]);
  eq("«на 90 минут», «напомнить за 2 часа»", P("Врач завтра 9:30 на 90 минут напомнить за 2 часа"), ["event", "Врач", "2026-11-22", "9:30", 90, 120, "none"]);
  ok("По будням: первое событие — понедельник, суббота пропускается", (() => { const p = qaParse("Планёрка по будням 10:00", now); const ev = { allDay: false, start: cFmt(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate(), 10, 0), false), end: cFmt(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate(), 11, 0), false), repeat: "weekdays" }; return cYmd(evOccurrences(ev, now, cAddDays(now, 7))[0].s) === "2026-11-23"; })());
  ok("«каждые 2 недели»", (() => { const p = qaParse("Уборка каждые 2 недели сб 10:00", now); return p.repeat === "weekly" && p.every === 2 && p.title === "Уборка"; })());
  ok("«каждые три дня»", (() => { const p = qaParse("Полив цветов каждые три дня в 9", now); return p.repeat === "daily" && p.every === 3 && p.title === "Полив цветов"; })());
  eq("English: dentist fri 3pm remind 1 hour", P("Dentist fri 3pm remind 1 hour"), ["event", "Dentist", "2026-11-27", "15:0", null, 60, "none"]);

  /* ---------- QR-код ---------- */
  section("QR-код подключения устройства");
  const qrDecode = async text => {
    const svg = qrSvg(text, 600).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    const img = new Image(); img.src = url; await img.decode();
    const cv = document.createElement("canvas"); cv.width = 640; cv.height = 640; const c = cv.getContext("2d");
    c.fillStyle = "#fff"; c.fillRect(0, 0, 640, 640); c.drawImage(img, 20, 20, 600, 600); URL.revokeObjectURL(url);
    try { const h = new Map(); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE]); const rd = new ZXing.MultiFormatReader(); rd.setHints(h);
      return rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText(); } catch (e) { return "ERR " + e; }
  };
  for (const t of ["SHUT", "Привет, мир!", "SHUT1:" + "A".repeat(102), "x".repeat(60), "SHUT1:" + btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(76)))).replace(/=+$/, "")])
    eq("QR распознаётся (" + t.length + " симв., версия " + qrEncode(t).version + ")", await qrDecode(t), t);
  ok("Слишком длинные данные — понятная ошибка", (() => { try { qrEncode("x".repeat(500)); return false; } catch (e) { return /длинные/.test(e.message); } })());

  /* ---------- Синхронизация: слияние ---------- */
  section("Синхронизация: слияние по записям");
  const E = (id, t, u, extra) => ({ id, title: t, type: "login", created: 100, updated: u, ...extra });
  const SYNC = 1000; // момент прошлой синхронизации
  let r1 = mergeEntries([E("a", "A", 500), E("b", "B-здесь", 1500)], [E("a", "A", 500), E("b", "B", 500)], SYNC);
  eq("Правка только здесь сохраняется", r1.entries.map(x => x.title), ["A", "B-здесь"]); eq("…и её нужно отправить", r1.needPush, true);
  r1 = mergeEntries([E("a", "A", 500)], [E("a", "A-там", 1500)], SYNC);
  eq("Правка только на другом устройстве приходит", r1.entries.map(x => x.title), ["A-там"]); eq("…отправлять нечего", r1.needPush, false);
  r1 = mergeEntries([E("a", "A", 500), E("n", "Новая здесь", 1600, { created: 1600 })], [E("a", "A", 500), E("m", "Новая там", 1700, { created: 1700 })], SYNC);
  eq("Новые записи с обеих сторон сохраняются", r1.entries.map(x => x.title).sort(), ["A", "Новая здесь", "Новая там"]);
  r1 = mergeEntries([E("a", "Здесь", 1600)], [E("a", "Там", 1800)], SYNC);
  eq("Изменили на обоих — конфликт, пока побеждает свежая", [r1.conflicts.length, r1.entries[0].title, r1.conflicts[0].picked], [1, "Там", "remote"]);
  eq("Конфликт: выбрать «Эта»", mergeResolve(r1.entries, r1.conflicts, { a: "local" }, " (копия)", () => "x").map(x => x.title), ["Здесь"]);
  eq("Конфликт: «Обе» — копия рядом", mergeResolve(r1.entries, r1.conflicts, { a: "both" }, " (копия)", () => "x").map(x => x.title), ["Там", "Здесь (копия)"]);
  r1 = mergeEntries([E("a", "A", 500, { deletedAt: 1500 })], [E("a", "A", 500)], SYNC);
  eq("Удаление здесь доходит до облака", [!!r1.entries[0].deletedAt, r1.needPush], [true, true]);
  r1 = mergeEntries([E("a", "A", 500, { used: 2000 })], [E("a", "A", 500, { used: 900 })], SYNC);
  eq("Только «когда использовали» — не конфликт", r1.conflicts.length, 0);
  r1 = mergeEntries([E("a", "Здесь", 1600)], [E("a", "Там", 1800)], 0);
  eq("Первая синхронизация (нет отметки) — без вопросов, свежая побеждает", [r1.conflicts.length, r1.entries[0].title], [0, "Там"]);

  const s2 = $("sum"); s2.className = "sum " + (fail ? "bad" : "ok");
  s2.textContent = fail ? `Провалено: ${fail} из ${pass + fail}` : `Все тесты пройдены: ${pass}`;
  document.title = (fail ? "✗ " : "✓ ") + document.title;
})().catch(e => { $("sum").className = "sum bad"; $("sum").textContent = "Ошибка при запуске тестов: " + e.message; });
</script>
